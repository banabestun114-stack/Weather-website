<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/layers.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d17">

    <!-- Search results. The site address placeholders are filled in at build time (vite/seo.mjs) -->
    <title>Weather Now – Forecast, Dust Alerts &amp; Heat Safety</title>
    <meta name="description" content="Free live weather for any city: hourly and 7-day forecast, dust storm alerts, heat safety advice and the best time to go outside. In English, Kurdish (Sorani) and Arabic.">
    <link rel="canonical" href="%SITE_URL%/">

    <!-- Link previews (WhatsApp, Telegram, Facebook, X…) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Weather Now">
    <meta property="og:title" content="Weather Now – Forecast, Dust Alerts &amp; Heat Safety">
    <meta property="og:description" content="Live weather with dust storm alerts, heat safety advice and the best time to go outside. English, Kurdish and Arabic.">
    <meta property="og:url" content="%SITE_URL%/">
    <meta property="og:image" content="%SITE_URL%/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Weather Now showing today's weather for Erbil">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Tells Google this is a free web app -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Weather Now",
        "url": "%SITE_URL%/",
        "description": "Live weather forecast with dust storm alerts, heat safety advice and the best time to go outside, in English, Kurdish (Sorani) and Arabic.",
        "applicationCategory": "WeatherApplication",
        "operatingSystem": "Any",
        "inLanguage": ["en", "ckb", "ar"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      Weather Now shows live weather, hourly and 7-day forecasts, dust storm alerts and heat safety advice.
      Please enable JavaScript to use it.
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
